apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-app-v3
  template:
    metadata:
      labels:
        app: quiz-app-v3
    spec:
      containers:
        - name: quiz-app-v3
          image: shanhdplus/quiz-app:v3
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-app-v3-service
spec:
  type: NodePort
  selector:
    app: quiz-app-v3
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30083
