apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-app-v1
  template:
    metadata:
      labels:
        app: quiz-app-v1
    spec:
      containers:
        - name: quiz-app
          image: shanhdplus/quiz-app:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-app-v1-service
spec:
  type: NodePort
  selector:
    app: quiz-app-v1
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30081
