apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-app-v2
  template:
    metadata:
      labels:
        app: quiz-app-v2
    spec:
      containers:
        - name: quiz-app
          image: shanhdplus/quiz-app:v2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-app-v2-service
spec:
  type: NodePort
  selector:
    app: quiz-app-v2
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30082
